name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/oauth-popup-hardening-20261010']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server & web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Document tools (pdftotext/pdfinfo for reading PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke — npm start on a fresh install
        run: npm run smoke
      - name: End-to-end — vertical slice
        run: npm run e2e:slice
        env: { AUDA_CHROMIUM: /usr/bin/google-chrome }
      - name: End-to-end — agents
        run: npm run e2e:agent
      - name: End-to-end — reliability drills
        run: npm run e2e:reliability
      - name: End-to-end — LM Studio, LAN, team chat
        run: npm run e2e:lan
      - name: End-to-end — zero-touch LM Studio (start, choose, download, load, heal, auto-connect)
        run: npm run e2e:lmstudio
      - name: End-to-end — organization, plugins (OAuth/MCP), custom agents, learning
        run: npm run e2e:org
      - name: End-to-end — office work (research, PDF, slides, Word, Excel)
        run: npm run e2e:office
        env: { AUDA_CHROMIUM: /usr/bin/google-chrome }

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke — npm start, commands through Git Bash
        run: npm run smoke
      - name: Smoke — commands through PowerShell (no Git Bash)
        run: npm run smoke
        env: { AUDA_SHELL: powershell.exe }
      - name: End-to-end — vertical slice (watch, investigate, approve, fix, remember, recover)
        run: npm run e2e:slice

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: auda-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
